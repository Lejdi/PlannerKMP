// The app's version, for both platforms.
//
// Read by androidApp/build.gradle.kts as a properties file, and #included by
// iosApp/Configuration/Config.xcconfig as an xcconfig. `//` is a comment in both formats, `#` is
// not — an xcconfig would try to read it as a preprocessor directive — so keep comments on `//`.
//
// The two numbers used to live once in each platform's own build file, which is two places to
// remember and no way to notice when they disagree.
MARKETING_VERSION=1.0
CURRENT_PROJECT_VERSION=1
